<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Panel Admin Ojol</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--a:#4f46e5;--a2:#4338ca;--dark:#111827;--g:#16a34a;--red:#dc2626;--amber:#f59e0b;--blue:#2563eb;--muted:#6b7280;--line:#e5e7eb;--txt:#111827;--bg:#f3f4f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg)}
button{font:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit}
.hidden{display:none!important}

/* LOGIN */
#auth{min-height:100vh;background:linear-gradient(160deg,#030712,#312e81);display:flex;flex-direction:column;justify-content:center;padding:24px}
.brand{text-align:center;color:#fff;margin-bottom:22px}
.brand img{width:76px;height:76px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.brand h1{margin:12px 0 2px;font-size:26px}.brand p{margin:0;opacity:.8;font-size:14px}
.box{background:#fff;border-radius:18px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.35);max-width:420px;width:100%;margin:0 auto}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a)}
.btn{padding:11px 16px;border-radius:10px;font-weight:700;font-size:14px;background:var(--a);color:#fff}
.btn.full{width:100%;padding:14px;font-size:16px;margin-top:14px}
.btn:active{background:var(--a2)}
.btn.g{background:var(--g)}.btn.red{background:var(--red)}.btn.gray{background:#e5e7eb;color:#374151}.btn.amber{background:var(--amber);color:#fff}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:16px}

/* SHELL */
header.top{background:var(--dark);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 0;position:sticky;top:0;z-index:600}
.hrow{display:flex;align-items:center;gap:10px;padding-bottom:8px}
.hrow b{font-size:17px}.hrow small{opacity:.7}
.hrow .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;opacity:.9}
.live i{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.3}}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 10px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;color:#9ca3af;padding:10px 12px;font-size:13px;font-weight:600;border-bottom:3px solid transparent;position:relative}
.tabs button.on{color:#fff;border-color:#818cf8}
.bd{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--red);color:#fff;font-size:11px;padding:0 5px;margin-left:4px}
.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 60px}

/* CARDS */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{display:block;font-size:22px;margin-top:2px}
.stat.hi{background:var(--a);color:#fff}.stat.hi small{color:#c7d2fe}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.g{background:#dcfce7;color:#166534}.pill.a{background:#fef3c7;color:#92400e}.pill.b{background:#dbeafe;color:#1e40af}.pill.r{background:#fee2e2;color:#991b1b}.pill.s{background:#e5e7eb;color:#374151}.pill.p{background:#ede9fe;color:#5b21b6}
.muted{color:var(--muted);font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}
.kv span:first-child{color:var(--muted)}.kv b{text-align:right}
.plus{color:var(--g);font-weight:700}.minus{color:var(--red);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:36px 10px}
.list2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.list2 .card{margin:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:20px;background:#fff;color:#374151;font-size:13px;font-weight:600;border:1.5px solid var(--line)}
.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:180px}

/* CHART */
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar .col{width:100%;max-width:46px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px 6px 0 0;overflow:hidden;background:#eef2ff}
.bar .col i{display:block;width:100%}
.bar .c1{background:var(--a)}.bar .c2{background:#fca5a5}
.bar small{font-size:11px;color:var(--muted);margin-top:4px}.bar b{font-size:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}

/* MAP */
#liveMap{height:62vh;min-height:360px;border-radius:14px;overflow:hidden;z-index:1}

/* MODAL */
.modal{position:fixed;inset:0;z-index:2000;background:rgba(17,24,39,.65);display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:520px;max-height:90vh;overflow:auto;position:relative}
.mbox h2{margin:0 36px 10px 0;font-size:18px}
.mbox .x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;background:#f3f4f6;font-size:15px}
.set-row{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.set-row:last-child{border:0}.set-row small{display:block;color:var(--muted);font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:3000;max-width:92%;box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.25s;text-align:center}
#toast.show{opacity:1}
@media(max-width:520px){.list2{grid-template-columns:1fr}.set-row{grid-template-columns:1fr 120px}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="auth" class="hidden">
  <div class="brand"><img src="icon.svg" alt=""><h1>Panel Admin</h1><p>Kontrol aplikasi driver &amp; pelanggan</p></div>
  <div class="box">
    <form onsubmit="return doLogin(event)">
      <label>Email admin</label><input id="lEmail" type="email" autocomplete="email" required>
      <label>Kata sandi</label><input id="lPass" type="password" autocomplete="current-password" required>
      <button class="btn full" id="btnLogin">Masuk</button>
    </form>
    <form id="formSetup" class="hidden" onsubmit="return doSetup(event)">
      <p class="muted" style="margin:0 0 4px">Membuat <b>admin pertama</b>. Hanya bisa dilakukan sekali, selama belum ada admin.</p>
      <label>Nama</label><input id="sName" required>
      <label>Email admin</label><input id="sEmail" type="email" autocomplete="email" required>
      <label>Kata sandi (min. 6 karakter)</label><input id="sPass" type="password" minlength="6" autocomplete="new-password" required>
      <label>Kode setup</label><input id="sCode" autocomplete="off" autocapitalize="characters" required>
      <button class="btn full" id="btnSetup">Buat admin &amp; masuk</button>
    </form>
    <div class="err" id="authErr"></div>
    <div style="text-align:center;margin-top:10px"><a href="#" id="lnkSetup" onclick="toggleSetup();return false" style="color:var(--a);font-size:13px;font-weight:600">Belum punya admin? Buat admin pertama</a></div>
  </div>
</section>

<!-- APP -->
<section id="app" class="hidden">
  <header class="top">
    <div class="hrow"><b>🛡 Panel Admin</b><span class="live"><i></i>Live</span><span class="sp"></span><small id="hUser"></small><button class="btn sm gray" onclick="logout()">Keluar</button></div>
    <div class="tabs" id="tabs">
      <button data-t="dash" class="on" onclick="showTab('dash')">Dashboard</button>
      <button data-t="live" onclick="showTab('live')">Peta Live</button>
      <button data-t="orders" onclick="showTab('orders')">Order<span class="bd hidden" id="bdOrders"></span></button>
      <button data-t="drivers" onclick="showTab('drivers')">Driver<span class="bd hidden" id="bdDrivers"></span></button>
      <button data-t="customers" onclick="showTab('customers')">Pelanggan</button>
      <button data-t="finance" onclick="showTab('finance')">Keuangan</button>
      <button data-t="review" onclick="showTab('review')">Tinjauan<span class="bd hidden" id="bdReview"></span></button>
      <button data-t="topup" onclick="showTab('topup')">Top up<span class="bd hidden" id="bdTopup"></span></button>
      <button data-t="settings" onclick="showTab('settings')">Pengaturan</button>
    </div>
  </header>

  <div class="wrap">
    <div class="tabpage" id="pg-dash"><div id="dashBox"></div></div>

    <div class="tabpage hidden" id="pg-live">
      <div class="row sb" style="margin-bottom:8px"><div class="legend" style="margin:0"><span><i style="background:#16a34a"></i>Driver online</span><span><i style="background:#f59e0b"></i>Driver sibuk</span><span><i style="background:#2563eb"></i>Titik jemput order aktif</span></div><span class="muted" id="liveInfo"></span></div>
      <div id="liveMap"></div>
    </div>

    <div class="tabpage hidden" id="pg-orders">
      <div class="chips" id="ordChips"></div>
      <div class="toolbar"><input id="ordQ" placeholder="Cari nama pelanggan / driver / alamat…" oninput="rOrders()"></div>
      <div id="orderList" class="list2"></div>
    </div>

    <div class="tabpage hidden" id="pg-drivers">
      <div class="chips" id="drvChips"></div>
      <div class="toolbar"><input id="drvQ" placeholder="Cari nama / plat / nomor HP…" oninput="rDrivers()"></div>
      <div id="driverList" class="list2"></div>
    </div>

    <div class="tabpage hidden" id="pg-customers">
      <div class="toolbar"><input id="cusQ" placeholder="Cari nama / nomor HP…" oninput="rCust()"></div>
      <div id="custList" class="list2"></div>
    </div>

    <div class="tabpage hidden" id="pg-finance"><div id="finBox"></div></div>
    <div class="tabpage hidden" id="pg-review"><div id="revBox"></div></div>
    <div class="tabpage hidden" id="pg-topup"><div class="chips" id="tpChips"></div><div id="tpList" class="list2"></div><div class="card" id="tpEvents"></div><div class="card" id="tpSetup"></div></div>
    <div class="tabpage hidden" id="pg-settings"><div id="setBox"></div></div>
  </div>
</section>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="mbox"><button class="x" onclick="closeModal()">✕</button><div id="mBody"></div></div></div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* =====================================================================
   PANEL ADMIN OJOL
   ===================================================================== */
const CFG = window.APP_CONFIG;
const $ = (id) => document.getElementById(id);
const rp = (n) => (Number(n) < 0 ? "-Rp " : "Rp ") + Math.abs(Math.round(Number(n) || 0)).toLocaleString("id-ID");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTime = (t) => t ? new Date(t).toLocaleString("id-ID", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "-";
const startOfDay = (d = new Date()) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };

if (!CFG || CFG.SUPABASE_URL.includes("XXXXXXXX")) { document.body.innerHTML = "<p style='padding:30px'>Isi config.js dulu.</p>"; throw new Error("config"); }
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

const S = {
  user: null, tab: "dash", settings: {}, drivers: [], profiles: {}, orders: [], wallet: [],
  topups: [], topEvents: [], docs: [], sanc: [], destChg: [], map: null, mk: null, f: { orders: "all", drivers: "all", topup: "all" }, loops: [], channel: null, loading: false, reload: null
};

/* ---------- LABEL ---------- */
const OST = { searching: ["a", "Mencari driver"], accepted: ["b", "Driver menuju jemput"], arrived: ["b", "Driver tiba"], ongoing: ["p", "Dalam perjalanan"], completed: ["g", "Selesai"], cancelled: ["r", "Batal"] };
const ACTIVE = ["searching", "accepted", "arrived", "ongoing"];
const SETTINGS = [
  ["commission_pct", "Komisi aplikasi (%)", "Dipotong dari saldo driver tiap order selesai"],
  ["base_fare_motor", "Tarif dasar motor (Rp)", "Tarif minimum"],
  ["per_km_motor", "Tarif per km motor (Rp)", ""],
  ["base_fare_mobil", "Tarif dasar mobil (Rp)", "Tarif minimum"],
  ["per_km_mobil", "Tarif per km mobil (Rp)", ""],
  ["dispatch_radius_km", "Radius cari driver (km)", "Driver di luar radius tidak ditawari"],
  ["offer_seconds", "Waktu tawaran ke driver (detik)", "Batas waktu driver menerima / menolak"],
  ["min_balance", "Saldo minimum agar driver bisa online & dapat order (Rp)", "Driver di bawah saldo ini tidak bisa online. Saldo tidak boleh minus (mis. 10000)"],
  ["complete_radius_m", "Radius selesai order dari titik antar (meter)", "Driver harus berada dalam jarak ini agar bisa menyelesaikan order"],
  ["dest_flag_m", "Batas geser titik antar yang ditandai curang (meter)", "Dipindah lebih jauh dari ini dari tujuan awal → masuk tab Tinjauan"],
  ["auto_enabled", "Sanksi otomatis aktif (1 = ya, 0 = tidak)", "Skorsing otomatis saat rating rendah / sering ditandai curang"],
  ["auto_min_rating", "Batas rata-rata rating (10 order terakhir)", "Di bawah angka ini → skorsing otomatis (mis. 3.5)"],
  ["auto_min_orders", "Minimal order bernilai sebelum sanksi otomatis", "Mis. 5 — agar 1 ulasan jelek tidak langsung menghukum"],
  ["auto_flag_limit", "Jumlah tanda curang dalam 7 hari → skorsing 1 hari", "Mis. 3"]
];
const NEW_KEYS = ["complete_radius_m", "dest_flag_m", "auto_enabled", "auto_min_rating", "auto_min_orders", "auto_flag_limit"];

/* ---------- UI ---------- */
let toastT;
function toast(m, ms = 3200) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms); }
function openModal(html) { $("mBody").innerHTML = html; $("modal").classList.remove("hidden"); }
function closeModal() { $("modal").classList.add("hidden"); $("mBody").innerHTML = ""; }
const nm = (id) => (S.profiles[id] && S.profiles[id].full_name) || "—";
const ph = (id) => (S.profiles[id] && S.profiles[id].phone) || "";
const waLink = (p) => "https://wa.me/" + String(p).replace(/\D/g, "").replace(/^0/, "62");
const ago = (t) => { if (!t) return "-"; const s = (Date.now() - new Date(t)) / 1000; return s < 60 ? "baru saja" : s < 3600 ? Math.floor(s / 60) + " mnt lalu" : s < 86400 ? Math.floor(s / 3600) + " jam lalu" : Math.floor(s / 86400) + " hari lalu"; };
const fresh = (d) => d.last_seen && Date.now() - new Date(d.last_seen) < 3 * 60 * 1000;
function drvState(d) {
  if (d.banned) return ["r", "Diblokir"];
  if (d.suspended_until && new Date(d.suspended_until) > new Date()) return ["r", "Diskors"];
  if (!d.approved) return ["a", "Menunggu persetujuan"];
  if (d.status === "offline") return ["s", "Offline"];
  if (!fresh(d)) return ["s", "Terputus"];
  return d.status === "busy" ? ["p", "Sibuk"] : ["g", "Online"];
}
function showTab(t) {
  S.tab = t;
  document.querySelectorAll(".tabpage").forEach((p) => p.classList.toggle("hidden", p.id !== "pg-" + t));
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
  render();
}
function chips(boxId, items, key, fn) {
  $(boxId).innerHTML = items.map(([v, l]) => `<button class="chip ${S.f[key] === v ? "on" : ""}" onclick="S.f.${key}='${v}';${fn}()">${l}</button>`).join("");
}

/* ---------- AUTH ---------- */
async function doLogin(e) {
  e.preventDefault(); $("authErr").textContent = ""; $("btnLogin").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("lEmail").value.trim(), password: $("lPass").value });
  $("btnLogin").disabled = false;
  if (error) { $("authErr").textContent = "Gagal masuk: " + (error.message.includes("Invalid") ? "email / kata sandi salah" : error.message); return false; }
  await boot(); return false;
}
function toggleSetup() {
  const openSetup = $("formSetup").classList.contains("hidden");
  $("formSetup").classList.toggle("hidden", !openSetup);
  document.querySelector("#auth form").classList.toggle("hidden", openSetup);
  $("lnkSetup").textContent = openSetup ? "Kembali ke login" : "Belum punya admin? Buat admin pertama";
  $("authErr").textContent = "";
}
async function doSetup(e) {
  e.preventDefault(); $("authErr").textContent = ""; $("btnSetup").disabled = true;
  const email = $("sEmail").value.trim(), pass = $("sPass").value;
  const su = await sb.auth.signUp({ email, password: pass, options: { data: { role: "customer", full_name: $("sName").value.trim(), phone: "-" } } });
  if (su.error || !su.data.session) {          // email mungkin sudah terdaftar → coba masuk dengan sandi yang sama
    const si = await sb.auth.signInWithPassword({ email, password: pass });
    if (si.error) {
      $("btnSetup").disabled = false;
      $("authErr").textContent = "Email ini sudah terdaftar dengan kata sandi lain. Pakai email lain, atau isi kata sandi yang benar.";
      return false;
    }
  }
  const { data: res, error } = await sb.rpc("claim_first_admin", { p_code: $("sCode").value.trim() });
  $("btnSetup").disabled = false;
  if (error || !res || !res.ok) {
    const msg = error ? "Gagal: " + error.message + " (sudah menjalankan setup-admin.sql?)" : res.msg;
    await sb.auth.signOut(); $("authErr").textContent = msg; return false;
  }
  await boot(); return false;
}
async function logout() { stopAll(); await sb.auth.signOut(); location.reload(); }
function stopAll() { S.loops.forEach(clearInterval); S.loops = []; if (S.channel) sb.removeChannel(S.channel); }

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("app").classList.add("hidden"); $("auth").classList.remove("hidden"); return; }
  S.user = session.user;
  const { data: me } = await sb.from("profiles").select("*").eq("id", S.user.id).single();
  if (!me || me.role !== "admin") {
    await sb.auth.signOut(); $("app").classList.add("hidden"); $("auth").classList.remove("hidden");
    $("authErr").textContent = "Akun ini bukan admin. Jalankan perintah SQL jadikan-admin di Supabase terlebih dulu."; return;
  }
  $("hUser").textContent = me.full_name || S.user.email;
  $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
  chips("ordChips", [["all", "Semua"], ["active", "Aktif"], ["completed", "Selesai"], ["cancelled", "Batal"]], "orders", "rOrders");
  chips("drvChips", [["all", "Semua"], ["pending", "Menunggu"], ["online", "Online"], ["busy", "Sibuk"], ["offline", "Offline"], ["docs", "Dokumen"], ["banned", "Diblokir"]], "drivers", "rDrivers");
  await loadAll(); startRealtime();
  S.loops.push(setInterval(loadAll, 10000));
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.user) loadAll(); });

/* ---------- DATA ---------- */
async function loadAll() {
  if (S.loading) return; S.loading = true;
  try {
    const [d, p, o, w, st, tq, te, dc, sc, ch] = await Promise.all([
      sb.from("drivers").select("*").limit(1000),
      sb.from("profiles").select("id,role,full_name,phone,created_at").limit(3000),
      sb.from("orders").select("*").order("created_at", { ascending: false }).limit(600),
      sb.from("wallet_tx").select("*").order("created_at", { ascending: false }).limit(400),
      sb.from("settings").select("*"),
      sb.from("topup_requests").select("*").order("created_at", { ascending: false }).limit(300),
      sb.from("topup_events").select("*").order("created_at", { ascending: false }).limit(60),
      sb.from("driver_docs").select("*").limit(2000),
      sb.from("driver_sanctions").select("*").order("created_at", { ascending: false }).limit(400),
      sb.from("order_dest_changes").select("*").order("created_at", { ascending: false }).limit(300)
    ]);
    if (d.error || p.error || o.error) { toast("Gagal memuat data: " + (d.error || p.error || o.error).message); return; }

/* ---------- DASHBOARD ---------- */
function chart7() {
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = startOfDay(); d.setDate(d.getDate() - i); days.push(d); }
  const data = days.map((d) => {
    const e = new Date(d); e.setDate(e.getDate() + 1);
    const os = S.orders.filter((o) => { const t = new Date(o.created_at); return t >= d && t < e; });
    return { d, ok: os.filter((o) => o.status === "completed").length, bad: os.filter((o) => o.status === "cancelled").length, all: os.length };
  });
  const max = Math.max(1, ...data.map((x) => x.ok + x.bad));
  return `<div class="bars">${data.map((x) => `<div class="bar"><b>${x.ok + x.bad || ""}</b><div class="col" style="height:${((x.ok + x.bad) / max) * 100}%"><i class="c2" style="height:${x.ok + x.bad ? (x.bad / (x.ok + x.bad)) * 100 : 0}%"></i><i class="c1" style="height:${x.ok + x.bad ? (x.ok / (x.ok + x.bad)) * 100 : 0}%"></i></div><small>${x.d.toLocaleDateString("id-ID", { weekday: "short" })}</small></div>`).join("")}</div>
  <div class="legend"><span><i style="background:var(--a)"></i>Selesai</span><span><i style="background:#fca5a5"></i>Batal</span></div>`;
}

}

/* ---------- TOP UP QRIS ---------- */
const TST = { pending: ["a", "Menunggu bayar"], paid: ["g", "Lunas"], expired: ["s", "Kedaluwarsa"], cancelled: ["s", "Dibatalkan"], review: ["p", "Perlu ditinjau"], rejected: ["r", "Ditolak"] };
function rTopup() {
  chips("tpChips", [["all", "Semua"], ["review", "Perlu ditinjau"], ["pending", "Menunggu"], ["paid", "Lunas"], ["expired", "Kedaluwarsa"]], "topup", "rTopup");
  const list = S.topups.filter((t) => S.f.topup === "all" || t.status === S.f.topup);
  $("tpList").innerHTML = list.length ? list.slice(0, 80).map((t) => `<div class="card">
      <div class="row sb"><b>${esc(nm(t.driver_id))}</b><span class="pill ${TST[t.status][0]}">${TST[t.status][1]}</span></div>
      <div class="row sb" style="margin:6px 0"><span class="muted">${fmtTime(t.created_at)} · top up ${rp(t.base_amount)} + kode ${t.unique_code}</span><b>${rp(t.total_amount)}</b></div>
      ${["pending", "expired", "review", "cancelled"].includes(t.status) ? `<div class="row"><button class="btn sm g" onclick="reviewTopup('${t.id}',true)">Setujui &amp; kreditkan</button><button class="btn sm gray" onclick="reviewTopup('${t.id}',false)">Tolak</button></div>` : ""}</div>`).join("")
    : '<div class="empty">Belum ada permintaan top up.</div>';
  const ev = S.topEvents.slice(0, 40);
  $("tpEvents").innerHTML = `<h3>Notifikasi masuk dari HP (terbaru)</h3>` + (ev.length ? ev.map((e) => `<div class="kv"><span>${fmtTime(e.created_at)}<br><small>${esc((e.raw_text || "").slice(0, 120))}</small></span><b style="font-size:12px;max-width:45%">${e.parsed_amount ? rp(e.parsed_amount) + "<br>" : ""}${esc(e.result || "-")}</b></div>`).join("") : '<div class="muted">Belum ada notifikasi masuk. Pasang pengirim notifikasi di HP (lihat kartu di bawah).</div>');
  const url = CFG.SUPABASE_URL + "/rest/v1/rpc/confirm_topup";
  $("tpSetup").innerHTML = `<h3>Pengaturan penerima notifikasi DANA</h3>
    <div class="muted" style="margin-bottom:8px">Aplikasi di HP Anda (MacroDroid/Tasker) mengirim isi notifikasi DANA ke alamat ini setiap ada uang masuk.</div>
    <label>URL (metode POST)</label><input readonly value="${esc(url)}" onclick="this.select()">
    <label>Header</label><input readonly value="apikey: ${esc(CFG.SUPABASE_ANON_KEY)}" onclick="this.select()">
    <label>Header</label><input readonly value="Content-Type: application/json" onclick="this.select()">
    <label>Body JSON</label><textarea readonly rows="3" onclick="this.select()" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:12px">{"p_token":"TOKEN_DI_BAWAH","p_text":"[isi notifikasi]","p_event_id":"[id unik]"}</textarea>
    <label>TOKEN rahasia (jangan dibagikan)</label>
    <div class="row"><input id="tpTok" readonly value="••••••••••••••••" style="flex:1"><button class="btn sm gray" onclick="showTok()">Tampilkan</button><button class="btn sm gray" onclick="copyTok()">Salin</button></div>
    <div style="margin-top:8px"><button class="btn sm amber" onclick="regenTok()">Buat token baru</button></div>`;
}
async function getTok() {
  const { data, error } = await sb.from("app_secrets").select("value").eq("key", "topup_token").single();
  if (error || !data) { toast("Token tidak ditemukan (jalankan patch-topup.sql)", 5000); return null; }
  return data.value;
}
async function showTok() { const t = await getTok(); if (t) $("tpTok").value = t; }
async function copyTok() { const t = await getTok(); if (!t) return; try { await navigator.clipboard.writeText(t); toast("Token disalin"); } catch (e) { $("tpTok").value = t; $("tpTok").select(); toast("Salin manual dari kolom"); } }
async function regenTok() {
  if (!confirm("Buat token baru? Token lama langsung tidak berlaku dan HP Anda harus diperbarui.")) return;
  const { data, error } = await sb.rpc("admin_regen_topup_token");
  if (error) return toast("Gagal: " + error.message, 5000);
  $("tpTok").value = data; toast("Token baru dibuat. Perbarui di HP.", 5000);
}
async function reviewTopup(id, ok) {
  if (!confirm(ok ? "Kreditkan saldo driver sekarang? Pastikan uang BENAR-BENAR sudah masuk di DANA Anda." : "Tolak permintaan ini?")) return;
  const { data, error } = await sb.rpc("admin_review_topup", { p_id: id, p_approve: ok });
  if (error) return toast("Gagal: " + error.message, 6000);
  if (!data.ok) return toast(data.msg);
  toast(ok ? "Saldo dikreditkan ✔" : "Ditolak"); loadAll();
}

/* ---------- DOKUMEN, SANKSI, TINJAUAN ---------- */
const DOCK = ["ktp", "stnk", "sim", "selfie"];
const DOCT = (k, veh) => (k === "ktp" ? "KTP" : k === "stnk" ? "STNK" : k === "sim" ? (veh === "mobil" ? "SIM A (mobil)" : "SIM C (motor)") : "Selfie");
const docsOf = (id) => S.docs.filter((x) => x.driver_id === id);
const docPending = (id) => docsOf(id).some((x) => x.status === "pending");
const isSuspD = (d) => d.suspended_until && new Date(d.suspended_until) > new Date();
const timeLeft = (t) => { const s = Math.max(0, Math.round((new Date(t) - Date.now()) / 1000)); return s >= 86400 ? Math.floor(s / 86400) + " hari " + Math.floor((s % 86400) / 3600) + " jam" : s >= 3600 ? Math.floor(s / 3600) + " jam " + Math.floor((s % 3600) / 60) + " mnt" : Math.max(1, Math.ceil(s / 60)) + " mnt"; };
const SKIND = { warning: ["a", "Peringatan"], suspension: ["r", "Skorsing"], ban: ["r", "Blokir"], lift: ["g", "Dicabut"] };
const mapLink = (lat, lng) => `https://www.google.com/maps?q=${lat},${lng}`;

function docBadge(d) {
  if (!d.docs_required && !docsOf(d.id).length) return "";
  const ds = docsOf(d.id), ok = ds.filter((x) => x.status === "approved").length, rej = ds.filter((x) => x.status === "rejected").length;
  const cls = ok === 4 ? "g" : docPending(d.id) ? "a" : rej || ds.length < 4 ? "r" : "s";
  return `<span class="pill ${cls}">📄 ${ok}/4 dokumen${docPending(d.id) ? " · perlu dicek" : ""}</span>`;
}

async function showDocImgs(id) {
  for (const x of docsOf(id)) {
    const { data } = await sb.storage.from("driver-docs").createSignedUrl(x.path, 600);
    const im = document.getElementById("di_" + x.kind);
    if (im && data) { im.src = data.signedUrl; im.parentElement.href = data.signedUrl; }
  }
}
async function reviewDoc(id, kind, ok) {
  let reason = "";
  if (!ok) { reason = prompt("Alasan menolak (akan terlihat oleh driver), mis. 'Foto buram, ambil ulang':"); if (!reason || !reason.trim()) return; }
  const { data, error } = await sb.rpc("admin_review_doc", { p_driver: id, p_kind: kind, p_ok: ok, p_reason: reason });
  if (error) return toast("Gagal: " + error.message + " (sudah menjalankan patch-v2.sql?)", 6000);
  if (!data.ok) return toast(data.msg);
  toast(ok ? "Dokumen disetujui ✔" : "Dokumen ditolak"); await loadAll(); driverDetail(id);
}
function docsSection(id, veh) {
  const ds = docsOf(id);
  if (!ds.length) return `<h3 style="margin:14px 0 4px;font-size:14px">Dokumen</h3><div class="muted">Belum ada dokumen diunggah.</div>`;
  return `<h3 style="margin:14px 0 6px;font-size:14px">Dokumen verifikasi</h3>` + DOCK.map((k) => {
    const x = ds.find((y) => y.kind === k);
    if (!x) return `<div class="kv"><span>${DOCT(k, veh)}</span><b><span class="pill r">Belum diunggah</span></b></div>`;
    const pill = x.status === "approved" ? '<span class="pill g">Disetujui</span>' : x.status === "pending" ? '<span class="pill a">Perlu dicek</span>' : '<span class="pill r">Ditolak</span>';
    return `<div style="border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px">
      <div class="row sb"><b>${DOCT(k, veh)}</b>${pill}</div>
      <a target="_blank" rel="noopener"><img id="di_${k}" alt="${DOCT(k, veh)}" style="width:100%;max-height:260px;object-fit:contain;background:#f3f4f6;border-radius:8px;margin:6px 0"></a>
      <div class="muted">Diunggah ${fmtTime(x.uploaded_at)}${x.reject_reason ? " · ditolak: " + esc(x.reject_reason) : ""} · ketuk foto untuk ukuran penuh</div>
      <div class="row" style="margin-top:6px"><button class="btn sm g" onclick="reviewDoc('${id}','${k}',true)">✔ Setujui</button><button class="btn sm red" onclick="reviewDoc('${id}','${k}',false)">✕ Tolak</button></div></div>`;
  }).join("");
}
function sancSection(id) {
  const ss = S.sanc.filter((x) => x.driver_id === id).slice(0, 12);
  return `<h3 style="margin:14px 0 4px;font-size:14px">Riwayat sanksi</h3>` + (ss.length ? ss.map((x) => `<div class="kv"><span>${fmtTime(x.created_at)} · <span class="pill ${SKIND[x.kind][0]}">${SKIND[x.kind][1]}${x.minutes ? " " + x.minutes + " mnt" : ""}</span>${x.source === "auto" ? ' <span class="pill s">otomatis</span>' : ""}<br><small>${esc(x.reason || "")}</small></span></div>`).join("") : '<div class="muted">Belum ada sanksi.</div>');
}

/* --- beri sanksi --- */
function openSanction(id, orderId) {
  const d = S.drivers.find((x) => x.id === id); if (!d) return;
  const o = orderId ? S.orders.find((x) => x.id === orderId) : null;
  openModal(`<h2>Beri sanksi</h2><div style="margin-bottom:6px"><b>${esc(nm(id))}</b> · ⭐ ${Number(d.rating).toFixed(2)}${isSuspD(d) ? ` <span class="pill r">Diskors ${timeLeft(d.suspended_until)} lagi</span>` : ""}</div>
    ${o ? `<div class="muted" style="margin-bottom:6px">Terkait order #${esc(o.id.slice(0, 8))}${o.rating ? " · " + "★".repeat(o.rating) : ""}${o.review ? " · “" + esc(o.review) + "”" : ""}${o.flag_reason ? "<br>" + esc(o.flag_reason) : ""}</div>` : ""}
    <label>Jenis sanksi</label>
    <select id="snKind" onchange="$('snDur').parentElement.classList.toggle('hidden', this.value!=='suspension')">
      <option value="warning">⚠️ Peringatan (akun tetap normal)</option><option value="suspension" selected>⏸ Skorsing (tidak bisa online selama waktu tertentu)</option><option value="ban">⛔ Blokir permanen</option></select>
    <div><label>Lama skorsing</label><select id="snDur">
      <option value="30">30 menit</option><option value="60">1 jam</option><option value="180">3 jam</option><option value="360">6 jam</option><option value="720">12 jam</option>
      <option value="1440">1 hari</option><option value="4320">3 hari</option><option value="10080">7 hari</option><option value="20160">14 hari</option><option value="43200">30 hari</option></select></div>
    <label>Alasan (terlihat oleh driver)</label><textarea id="snWhy" rows="3" placeholder="mis. Ulasan pelanggan: driver kasar / menurunkan penumpang bukan di tujuan"></textarea>
    <button class="btn full red" id="snGo" onclick="doSanction('${id}','${orderId || ""}')">Terapkan sanksi</button>`);
}
async function doSanction(id, orderId) {
  const kind = $("snKind").value, mins = Number($("snDur").value), why = $("snWhy").value.trim();
  if (!why) return toast("Alasan wajib diisi");
  if (kind === "ban" && !confirm("Blokir permanen driver ini?")) return;
  $("snGo").disabled = true;
  const { data, error } = await sb.rpc("admin_sanction", { p_driver: id, p_kind: kind, p_minutes: kind === "suspension" ? mins : null, p_reason: why, p_order: orderId || null });
  $("snGo").disabled = false;
  if (error) return toast("Gagal: " + error.message + " (sudah menjalankan patch-v2.sql?)", 6000);
  if (!data.ok) return toast(data.msg);
  closeModal(); toast("Sanksi diterapkan ✔"); loadAll();
}
async function liftSusp(id) {
  if (!confirm("Cabut skorsing driver ini sekarang?")) return;
  const { data, error } = await sb.rpc("admin_lift_sanction", { p_driver: id });
  if (error) return toast("Gagal: " + error.message, 6000);
  if (!data.ok) return toast(data.msg);
  toast("Skorsing dicabut"); loadAll();
}
async function checkReview(orderId) {
  const { data, error } = await sb.rpc("admin_check_review", { p_order: orderId });
  if (error) return toast("Gagal: " + error.message, 6000);
  if (!data.ok) return toast(data.msg);
  toast("Ditandai sudah diperiksa"); loadAll();
}

/* --- tab Tinjauan --- */
function reviewItems() {
  const neg = S.orders.filter((o) => o.driver_id && o.rating && o.rating <= 2 && !o.review_checked);
  const flg = S.orders.filter((o) => o.flagged && !o.review_checked);
  const low = S.drivers.filter((d) => {
    if (d.banned || isSuspD(d)) return false;
    const rs = S.orders.filter((o) => o.driver_id === d.id && o.status === "completed" && o.rating).sort((a, b) => new Date(b.completed_at) - new Date(a.completed_at)).slice(0, 10);
    d._avg = rs.length ? rs.reduce((a, o) => a + o.rating, 0) / rs.length : null; d._n = rs.length;
    return rs.length >= 5 && d._avg < 4;
  });
  return { neg, flg, low };
}
function rReview() {
  const { neg, flg, low } = reviewItems();
  const act = S.drivers.filter(isSuspD);
  const orderCard = (o, extra) => `<div class="card"><div class="row sb"><b>${esc(nm(o.driver_id))}</b><span class="muted">${fmtTime(o.completed_at || o.created_at)}</span></div>
    <div class="muted" style="margin:4px 0">Pelanggan: ${esc(nm(o.customer_id))} · order #${esc(o.id.slice(0, 8))}</div>${extra}
    <div class="row" style="margin-top:8px"><button class="btn sm red" onclick="openSanction('${o.driver_id}','${o.id}')">⚖ Beri sanksi</button><button class="btn sm gray" onclick="checkReview('${o.id}')">Abaikan</button><button class="btn sm gray" onclick="orderDetail('${o.id}')">Detail order</button></div></div>`;
  $("revBox").innerHTML = `
    <div class="card"><h3>⭐ Ulasan negatif (bintang 1–2) belum diperiksa · ${neg.length}</h3></div>
    ${neg.length ? neg.map((o) => orderCard(o, `<div style="color:#f59e0b;font-size:18px">${"★".repeat(o.rating)}${"☆".repeat(5 - o.rating)}</div><div>${o.review ? "“" + esc(o.review) + "”" : '<span class="muted">(tanpa komentar)</span>'}</div>`)).join("") : '<div class="empty">Tidak ada.</div>'}
    <div class="card"><h3>🚩 Titik antar dipindah jauh (diduga curang) · ${flg.length}</h3></div>
    ${flg.length ? flg.map((o) => {
      const ch = S.destChg.filter((c) => c.order_id === o.id);
      return orderCard(o, `<div>${esc(o.flag_reason || "")}</div>
        <div class="muted" style="margin-top:4px">Jarak saat selesai: ${o.complete_dist_m != null ? o.complete_dist_m + " m" : "-"} · Tarif ${rp(o.fare)}</div>
        <div class="row" style="margin-top:6px"><a class="btn sm gray" style="text-decoration:none" target="_blank" rel="noopener" href="${mapLink(o.orig_dest_lat ?? o.dest_lat, o.orig_dest_lng ?? o.dest_lng)}">🗺 Tujuan awal</a><a class="btn sm gray" style="text-decoration:none" target="_blank" rel="noopener" href="${mapLink(o.dest_lat, o.dest_lng)}">🗺 Titik antar akhir</a></div>
        ${ch.map((c) => `<div class="muted">• ${fmtTime(c.created_at)}: geser ${c.moved_m} m (dari awal ${c.from_orig_m} m) — ${esc(c.reason)}</div>`).join("")}`);
    }).join("") : '<div class="empty">Tidak ada.</div>'}
    <div class="card"><h3>📉 Driver rating rendah (rata-rata 10 order terakhir &lt; 4,0) · ${low.length}</h3></div>
    ${low.length ? low.map((d) => `<div class="card"><div class="row sb"><b>${esc(nm(d.id))}</b><span class="pill r">⭐ ${d._avg.toFixed(2)} (${d._n} order)</span></div>
      <div class="row" style="margin-top:8px"><button class="btn sm red" onclick="openSanction('${d.id}')">⚖ Beri sanksi</button><button class="btn sm gray" onclick="driverDetail('${d.id}')">Detail</button></div></div>`).join("") : '<div class="empty">Tidak ada.</div>'}
    <div class="card"><h3>⏸ Sedang diskors · ${act.length}</h3>${act.length ? act.map((d) => `<div class="kv"><span>${esc(nm(d.id))}<br><small>sisa ${timeLeft(d.suspended_until)}</small></span><b><button class="btn sm gray" onclick="liftSusp('${d.id}')">Cabut</button></b></div>`).join("") : '<div class="muted">Tidak ada.</div>'}</div>
    <div class="card"><h3>Log sanksi terbaru</h3>${S.sanc.slice(0, 20).map((x) => `<div class="kv"><span>${fmtTime(x.created_at)} · ${esc(nm(x.driver_id))}<br><small>${esc(x.reason || "")}</small></span><b><span class="pill ${SKIND[x.kind][0]}">${SKIND[x.kind][1]}${x.minutes ? " " + x.minutes + "m" : ""}</span>${x.source === "auto" ? '<br><small>otomatis</small>' : ""}</b></div>`).join("") || '<div class="muted">Belum ada sanksi.</div>'}</div>`;
}

/* ---------- PENGATURAN ---------- */
function rSet() {
  if ($("setBox").dataset.dirty === "1") return;   // jangan timpa saat sedang mengetik
  $("setBox").innerHTML = `<div class="card"><h3>Tarif &amp; aturan aplikasi</h3>
    ${SETTINGS.map(([k, l, h]) => `<div class="set-row"><div>${l}<small>${h}</small></div><input type="number" inputmode="decimal" data-k="${k}" value="${S.settings[k] ?? ""}" oninput="$('setBox').dataset.dirty='1'"></div>`).join("")}
    <button class="btn full" onclick="saveSettings()">Simpan pengaturan</button>
    <p class="muted" style="margin-bottom:0">Perubahan berlaku untuk order BARU. Order yang sedang berjalan tidak berubah.</p></div>`;
}
async function saveSettings() {
  const rows = [];
  for (const el of document.querySelectorAll("#setBox input[data-k]")) {
    if (el.value === "" && NEW_KEYS.includes(el.dataset.k)) continue;   // belum menjalankan patch-v2.sql
    const v = Number(el.value); if (el.value === "" || !isFinite(v)) return toast("Semua kolom harus berisi angka");
    rows.push({ key: el.dataset.k, value: v });
  }
  const c = rows.find((r) => r.key === "commission_pct").value;
  if (c < 0 || c > 50) return toast("Komisi harus antara 0 – 50%");
  if (rows.find((r) => r.key === "dispatch_radius_km").value <= 0 || rows.find((r) => r.key === "offer_seconds").value < 10) return toast("Radius harus > 0 dan waktu tawaran min. 10 detik");
  const { error } = await sb.from("settings").upsert(rows);
  if (error) return toast("Gagal menyimpan: " + error.message, 6000);
  $("setBox").dataset.dirty = "0"; toast("Pengaturan disimpan ✔"); loadAll();
}

sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") { $("app").classList.add("hidden"); $("auth").classList.remove("hidden"); } });
boot();
</script>
</body>
</html>
